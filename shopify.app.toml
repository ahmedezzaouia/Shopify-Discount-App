# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "16966a0dc4113dc067dbb3ed282002d1"
name = "Customer-Discount"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "metaobjects/update" ]
  uri = "/webhooks/metaobjects/update"
  filter = "type:app--16966a0dc4113dc067dbb3ed282002d1--discount"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions,write_discounts,write_app_proxy"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

# Storefront fetches rules at /apps/customer-discount/cart-auto-add-rules (same origin).
[app_proxy]
url = "https://example.com/api/proxy"
prefix = "apps"
subpath = "customer-discount"

# JSON array of auto-add rules for the Theme App Extension (Cart Ajax).
# Storefront must read this in theme Liquid; without public_read, rules stay blank.
[shop.metafields.app.cart_auto_add_rules]
name = "Cart auto-add rules"
type = "json"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[metaobjects.app.discount]
name = "Discount"
description = "Buy X Get Y discount stored by Deal Forge"

  [metaobjects.app.discount.access]
  admin = "merchant_read_write"

[metaobjects.app.discount.fields.name]
name = "Name"
type = "single_line_text_field"
required = true

[metaobjects.app.discount.fields.discount_type]
name = "Type"
type = "single_line_text_field"
validations.choices = ["automatic", "code"]

[metaobjects.app.discount.fields.status]
name = "Status"
type = "single_line_text_field"
validations.choices = ["active", "inactive"]

[metaobjects.app.discount.fields.buy_qty]
name = "Buy quantity"
type = "number_integer"

[metaobjects.app.discount.fields.get_qty]
name = "Get quantity"
type = "number_integer"

[metaobjects.app.discount.fields.buy_products]
name = "Buy products"
type = "list.product_reference"

[metaobjects.app.discount.fields.get_products]
name = "Get products"
type = "list.product_reference"

[metaobjects.app.discount.fields.discount_value_type]
name = "Discount value type"
type = "single_line_text_field"
validations.choices = ["free", "percentage", "fixed"]

[metaobjects.app.discount.fields.discount_value]
name = "Discount value"
type = "number_decimal"

[metaobjects.app.discount.fields.auto_add]
name = "Auto add"
type = "boolean"

[metaobjects.app.discount.fields.start_date]
name = "Start date"
type = "date"

[metaobjects.app.discount.fields.has_end]
name = "Has end date"
type = "boolean"

[metaobjects.app.discount.fields.end_date]
name = "End date"
type = "date"

[metaobjects.app.discount.fields.shopify_discount_id]
name = "Linked Shopify discount"
description = "GID of the Shopify Discount that runs the Function for this rule"
type = "single_line_text_field"
