query CartInput {
  cart {
    lines {
      id
      quantity
      merchandise {
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
    }
  }
  discount {
    metafield(namespace: "$app:discount", key: "rule") {
      value
    }
  }
  fetchResult {
    status
    jsonBody
  }
}
